name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css site.css site.js brand.js palette.js swatches.js shape.js app.js favicon.svg assets animace barvy assety _site/
      # GitHub Pages posílá soubory s max-age=600. Bez razítka by si návštěvník po
      # nasazení mohl načíst nové HTML se starým CSS, proto se k lokálním souborům
      # v HTML přidá ?v=<zkrácený SHA commitu>. Zdrojové soubory zůstávají čisté.
      - name: Stamp asset URLs with the commit SHA
        run: |
          v="${GITHUB_SHA::7}"
          pages="_site/index.html _site/animace/index.html _site/barvy/index.html _site/assety/index.html"
          sed -i -E "s#((href|src)=\"(\.\./)?(site\.css|style\.css|site\.js|brand\.js|palette\.js|swatches\.js|shape\.js|app\.js|barvy\.css|barvy\.js|assety\.css|assety\.js|favicon\.svg|assets/Logo\.svg))\"#\1?v=${v}\"#g" $pages
          for f in $pages; do grep -q "site.css?v=${v}" "$f"; grep -q "site.js?v=${v}" "$f"; done
          grep -c "?v=${v}" $pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
