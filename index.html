<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generátor tvarů · Onkorádce</title>
  <meta name="description" content="Generátor SVG tvarů se šesti výřezy. Zkopíruj do schránky nebo stáhni.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-logo" href="./" aria-label="Onkorádce – úvod"><img src="assets/Logo.svg" alt="Onkorádce"></a>
      <nav class="site-nav" aria-label="Hlavní navigace">
        <a href="./" aria-current="page">Generátor tvarů</a>
        <a href="animace/">Animace</a>
      </nav>
    </div>
  </header>

  <header class="top">
    <h1>Generátor tvarů</h1>
    <p class="lead">Tvar se šesti výřezy v poměru 10&nbsp;:&nbsp;9. Klikni na něj a SVG se zkopíruje.</p>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Náhled tvaru">
      <button type="button" id="shape" class="shape" title="Zkopírovat SVG do schránky" aria-label="Zkopírovat SVG do schránky"></button>
      <p class="dims" id="dims"></p>
    </section>

    <form class="panel" id="controls" aria-label="Nastavení tvaru" onsubmit="return false">
      <div class="field">
        <div class="field-head">
          <label for="depth">Hloubka výřezů</label>
          <output id="depth-out" for="depth"></output>
        </div>
        <input id="depth" type="range" min="30" max="88" step="1">
      </div>

      <div class="field">
        <div class="field-head">
          <label for="size">Velikost (výška)</label>
          <output id="size-out" for="size"></output>
        </div>
        <input id="size" type="range" min="100" max="1000" step="10">
      </div>

      <div class="field field-inline">
        <label for="color">Barva</label>
        <input id="color" type="color">
        <output id="color-out" for="color"></output>
      </div>

      <details class="more">
        <summary>Další nastavení</summary>

        <div class="more-body">
          <div class="field">
            <div class="field-head">
              <label for="cutWidth">Šířka výřezu</label>
              <output id="cutWidth-out" for="cutWidth"></output>
            </div>
            <input id="cutWidth" type="range" min="4" max="20" step="0.5">
            <p class="note">Nemění se s velikostí tvaru.</p>
          </div>

          <div class="field">
            <div class="field-head">
              <label for="radius">Zaoblení X</label>
              <output id="radius-out" for="radius"></output>
            </div>
            <input id="radius" type="range" min="0" max="10" step="0.1">
            <p class="note">Hlavní rohy mají X, ústí výřezů 2·X.</p>
          </div>

          <div class="field">
            <div class="field-head">
              <label for="offset">Posun vodorovných výřezů</label>
              <output id="offset-out" for="offset"></output>
            </div>
            <input id="offset" type="range" min="0" max="12" step="0.1">
          </div>
        </div>
      </details>

      <div class="actions">
        <button type="button" id="copy" class="btn primary">Kopírovat SVG</button>
        <button type="button" id="download" class="btn">Stáhnout SVG</button>
      </div>
      <button type="button" id="reset" class="link">Obnovit výchozí hodnoty</button>
    </form>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="shape.js"></script>
  <script src="app.js"></script>
</body>
</html>
